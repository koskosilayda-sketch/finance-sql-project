name: SQL Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-sql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d finance_ci -f schema/01_schema.sql

      - name: Load seed data
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d finance_ci -f seed/02_seed_data.sql

      - name: Run analysis queries (sanity check)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d finance_ci -f queries/03_anal
